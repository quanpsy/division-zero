<!DOCTYPE html>
<html lang="en">

<head>
    <!-- ============================================
         Division Zero - Dictionary Page
         ============================================
         Vibecoder terminology with AI prompts.
         ============================================ -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="The vibecoder's dictionary. Learn coding terms with definitions, examples, and AI prompts to implement them.">

    <title>Dictionary - divisionzero</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/assets/images/white-logo.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS Files -->
        <!-- CSS Bundle -->
    <link rel="stylesheet" href="styles.min.css">
</head>

<body>

    <!-- NAVIGATION -->
    <div id="nav-placeholder" data-page="dictionary"></div>


    <!-- ========================================
         HERO SECTION
         ======================================== -->
    <section class="dictionary-hero">
        <div class="container">
            <div class="section-header">
                <h1 class="section-title">
                    <span class="gradient-text">Vibecoder's</span> Dictionary
                </h1>
                <p class="section-description">
                    Learn the language of modern web development.
                    Every term comes with an AI prompt to help you implement it.
                </p>
                <a href="#" id="full-library-link" class="hero-external-link">
                    Our library →
                </a>
            </div>
        </div>
    </section>


    <!-- ========================================
         SEARCH
         ======================================== -->
    <section class="section" style="padding-top: 0;">
        <div class="container">
            <div class="dictionary-controls">
                <input type="text" id="term-search" class="search-input" placeholder="Search terms...">
            </div>
        </div>
    </section>


    <!-- ========================================
         TERMS CONTAINER
         Cards rendered here by JS
         ======================================== -->
    <section class="section" style="padding-top: 0;">
        <div class="container" id="terms-container">
            <!-- Term cards inserted by dictionary.js -->
        </div>
    </section>


    <!-- ========================================
         TERM MODAL
         Opened when clicking a term card
         ======================================== -->
    <div class="modal term-modal" id="term-modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content glass">
            <!-- Content inserted by dictionary.js -->
        </div>
    </div>


    <!-- FOOTER -->
    <div id="footer-placeholder"></div>


    <!-- JavaScript Files -->
    <!-- Set external link from config -->
    <script>
        document.getElementById('full-library-link').href = CONFIG.FULL_DICTIONARY_LIBRARY_URL;
    </script>    <!-- JS Bundle -->
    <script src="app.min.js"></script>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW error:', err));
            });
        }
    </script>
</body>

</html>
